app:
  name: Bopel Automation Toolkit
  version: "1.0.0"
  subtitle: Internal Warehouse Utilities

tools:
  - name: Checklist Automation
    script: check.py
    description: Checklist pesanan dan validasi harga Shopee vs aplikasi
    target_window_title: Inventorycabang
    # Auto-Fetch Shopee (2026-08-19, dipindah dari tool terpisah ke sini):
    # selector toko + tombol "Fetch dari Shopee" di ToolScreen tool ini.
    # Fetcher (shopee_fetch.py) membuka Chrome profile toko yang SAMA
    # dengan shortcut desktop (Profile 7 = Toko Alkes Solo) via Playwright
    # persistent context -> cookie login ke-reuse. Hasil Ctrl+A/C halaman
    # income (blok Dana Dilepaskan, 6 baris/pesanan) LANGSUNG dipakai
    # check.py STEP 1 (kode via regex + harga Shopee dari blok per kode —
    # diverifikasi kompatibel 2026-08-19, lihat logs/session_report.md).
    uses_stores: true

  - name: Screenshot Iklan
    script: screenshot_iklan.py
    description: Screenshot chart dashboard iklan Shopee per toko & rentang tanggal
    uses_stores: true
    date_range: true

  - name: Inventory Scanner
    script: scan.py
    description: Scan status pembayaran dan validasi Excel
    target_window_title: Inventorycabang
    # Kelompok D — 3 mode eksekusi (Opsi B): 1 tool, beberapa tombol.
    # Mode 1 & 2 tetap AUTO-DETECT dari isi clipboard (keputusan user
    # 2026-08-15): scan.py pilih mode kecil/besar sendiri dari format
    # clipboard (tabel Excel 'No. Pesanan' = besar, kode polos = kecil).
    # Beda tombol = panduan data yang diharapkan. Mode 3 (Scan Bulanan)
    # pakai script terpisah scan_bulanan.py (restore dari git history +
    # disinkronkan dengan scan.py; output hasil_scan_bulanan.xlsx).
    # script di mode opsional — kosong = pakai script tool induk (scan.py).
    modes:
      - name: Scan Kecil
        description: Data detail, jumlah sedikit — clipboard berisi daftar kode polos atau hasil copy Dana Dilepaskan Shopee (kode + harga otomatis untuk validasi)
      - name: Scan Detail
        description: Data agak banyak + detail periode tertentu — clipboard berisi tabel Excel Shopee
      - name: Scan Bulanan
        description: Data periode 1 bulan atau lebih — clipboard berisi tabel Excel Shopee
        script: scan_bulanan.py

# Toko Shopee yang bisa dijadikan sumber Auto-Fetch (selector di UI).
# Pola mirip tools[].modes: nambah toko baru = edit config saja.
# Ketiga toko AKTIF (2026-08-20): URL income SAMA untuk semua toko
# (INCOME_URL di shopee_fetch.py) — hanya profile Chrome yang beda.
# shortcut: path .lnk toko di desktop (WAJIB untuk toko enabled) — bot
# menjalankannya persis seperti double-click user, lalu menempel ke window
# Chrome toko (lihat shopee_fetch.py; pengganti Playwright/CDP 2026-08-19:
# Chrome 136+ mengabaikan remote-debugging-port pada user data dir default).
# chrome_user_data_dir + profile_directory diambil dari shortcut .lnk toko
# (Langkah 0 investigasi 2026-08-19 & diverifikasi ulang 2026-08-20) —
# jangan ditebak (dipakai sebagai dokumentasi; fetch tidak lagi membuka
# profil via Playwright).
# akun: nama akun Shopee toko (muncul di sidebar seller center, terbaca
# lewat Ctrl+A/C) — dipakai shopee_fetch.py untuk VERIFIKASI identitas
# window sebelum fetch: window yang terangkat harus memuat token ini di
# halamannya. Ground truth 2026-08-22 (Ctrl+A/C tiap window toko).
stores:
  - name: Toko 1 — Toko Alkes Solo
    enabled: true
    shortcut: C:\Users\PC\Desktop\Toko Alkes Solo.lnk
    akun: tokoalkessolo
    chrome_user_data_dir: C:\Users\PC\AppData\Local\Google\Chrome\User Data
    profile_directory: Profile 7
  - name: Toko 2 — Toko Alkes BSM
    enabled: true
    shortcut: C:\Users\PC\Desktop\Toko Alkes BSM.lnk
    akun: tokoalkesbsm
    chrome_user_data_dir: C:\Users\PC\AppData\Local\Google\Chrome\User Data
    profile_directory: Profile 10
  - name: Toko 3 — Alkes Medika Solo
    enabled: true
    shortcut: C:\Users\PC\Desktop\Alkes Medika Solo.lnk
    akun: alkesmedikasolo
    chrome_user_data_dir: C:\Users\PC\AppData\Local\Google\Chrome\User Data
    profile_directory: Profile 9

logging:
  level: INFO
  file: logs/app.log
